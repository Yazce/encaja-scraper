name: Scrape Inmoparadise

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape-inmoparadise
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper/scrape_inmoparadise.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_latest.json data/pisos.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualiza snapshot de Inmoparadise ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
